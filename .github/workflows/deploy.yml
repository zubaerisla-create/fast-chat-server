name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/fast-chat-server

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check
        run: |
          for f in $(git ls-files '*.js' | grep -v '^frontend/'); do node --check "$f"; done

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload compose files
        run: |
          scp -i ~/.ssh/deploy_key deploy/docker-compose.yml deploy/Caddyfile \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/fast-chat/"

      - name: Pull & restart
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" bash -s <<EOF
          set -euo pipefail
          cd /opt/fast-chat
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          export API_IMAGE="${{ env.IMAGE }}:${{ github.sha }}"
          sed -i '/^API_IMAGE=/d' .env && echo "API_IMAGE=\$API_IMAGE" >> .env
          docker compose pull api
          docker compose up -d --remove-orphans
          docker logout ghcr.io
          docker image prune -f
          EOF

      - name: Health check
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "http://${{ secrets.VPS_HOST }}/health"; then exit 0; fi
            sleep 3
          done
          echo "API did not become healthy" && exit 1
