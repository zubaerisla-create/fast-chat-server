# Staging vhost — NOT INSTALLED. Requires owner approval (shared host nginx).
# Install:  cp to /etc/nginx/sites-available/fastchat-staging, symlink into
#           sites-enabled, `nginx -t && systemctl reload nginx` (reload, never restart),
#           then `certbot --nginx -d fastchat-staging.hosensoft.com`.
# Rollback: remove the symlink, `nginx -t && systemctl reload nginx`.
#
# One hostname serves the staging website and the staging API, so a single
# Cloudflare Access application protects both (same-origin cookie). Basic auth
# is not used because the API already uses the Authorization header for JWTs.
#
# Cloudflare must be configured with:
#   - DNS: fastchat-staging (proxied)
#   - Zero Trust Access application on fastchat-staging.hosensoft.com
#   - Transform Rule adding header X-Staging-Origin-Key: <secret> to requests
#     for this hostname, so direct-to-origin requests (bypassing Access) get 403.
#     The secret goes into /etc/nginx/fastchat-staging-origin-key.conf as:
#       set $staging_origin_key "<secret>";   (chmod 600, never in git)

server {
    listen 80;
    listen [::]:80;
    server_name fastchat-staging.hosensoft.com;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    # certbot adds: listen 443 ssl; ssl_certificate ...; include options-ssl-nginx.conf;
    server_name fastchat-staging.hosensoft.com;

    include /etc/nginx/fastchat-staging-origin-key.conf;
    if ($http_x_staging_origin_key != $staging_origin_key) { return 403; }

    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    client_max_body_size 30M;

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # Staging API (Docker, 127.0.0.1:5101)
    location ~ ^/(api|uploads|health)(/|$) {
        proxy_pass http://127.0.0.1:5101;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io/ {
        proxy_pass http://127.0.0.1:5101;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    # Staging website (PM2 fast-chat-website-staging, 127.0.0.1:3011)
    location / {
        proxy_pass http://127.0.0.1:3011;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
