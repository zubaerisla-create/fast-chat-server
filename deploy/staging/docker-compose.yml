# Staging stack on the shared VPS (/opt/fast-chat-staging). Fully separate from
# production: own compose project, network, volumes, database and secrets.
# Secrets live in /opt/fast-chat-staging/.env on the server (chmod 600) — never in git.
# The explicit project name matters: production deploys run `--remove-orphans`
# under the project "fast-chat", which must never match this one.
name: fast-chat-staging

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "max_connections=20", "-c", "work_mem=2MB"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 20
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.5
    pids_limit: 100
    <<: *logging

  api:
    image: ${API_IMAGE:?API_IMAGE must be set in .env}
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 5000
      NODE_ENV: production
      FASTCHAT_ENV: staging
      UPLOAD_DIR: /app/uploads
      DB_POOL_MAX: 5
      CALLS_ENABLED: "false"
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ports:
      - "127.0.0.1:5101:5000"
    volumes:
      - uploads:/app/uploads
    networks: [backend, edge]
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.5
    pids_limit: 200
    <<: *logging

  # Catches every email the staging API sends (OTP, password reset). Nothing is
  # relayed to real inboxes. Web UI on 127.0.0.1:8025, reach it over an SSH tunnel.
  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
      MP_MAX_MESSAGES: "500"
    ports:
      - "127.0.0.1:8025:8025"
    networks: [backend, edge]
    mem_limit: 64m
    memswap_limit: 64m
    cpus: 0.2
    pids_limit: 50
    <<: *logging

networks:
  # No outbound route: the database is only reachable from the API.
  backend:
    internal: true
  edge: {}

volumes:
  pgdata:
  uploads:
