# Production stack on the VPS (/opt/fast-chat). Host Nginx terminates HTTPS for
# fastchat.hosensoft.com and proxies to the API on 127.0.0.1:5100.
# Secrets live in /opt/fast-chat/.env on the server (chmod 600) — never in git.
name: fast-chat

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    image: ${API_IMAGE:-ghcr.io/zubaerisla-create/fast-chat-server:latest}
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 5000
      NODE_ENV: production
      UPLOAD_DIR: /app/uploads
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ports:
      - "127.0.0.1:5100:5000"
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
